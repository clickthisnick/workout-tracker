<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; script-src-attr 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; media-src data:; connect-src 'self'; base-uri 'none'; object-src 'none'"
    />
    <title>Workout Tracker</title>
    <style>
      :root {
        color-scheme: dark;
        accent-color: #a84444;

        --bg: #0d0d0d;
        --surface: #1a1a1a;
        --accent: #7c2d2d;
        --accent-light: #a84444;
        --text: #f0f0f0;
        --text-dim: #9a9a9a;
        --border: #333;
      }

      * {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      html,
      body {
        background: var(--bg);
        color: var(--text);
        margin: 0;
        height: 100%;
        touch-action: manipulation;
        overscroll-behavior: none;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 14px;
        padding: 8px 12px;
        padding-bottom: max(8px, env(safe-area-inset-bottom));
        max-width: 480px;
        margin-inline: auto;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      select,
      input,
      button {
        background: var(--surface);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px 10px;
        font-size: 14px;
        font-family: inherit;
      }

      /* iOS Safari auto-zooms the page when focusing a text input/select with
     font-size under 16px. Keep those at 16px to prevent that; buttons
     (including quick-buttons) aren't affected and stay compact. */
      select,
      input[type='text'],
      input[type='email'],
      input[type='number'] {
        font-size: 16px;
      }

      button {
        background: var(--accent);
        cursor: pointer;
        font-weight: 600;
      }

      button:active {
        background: var(--accent-light);
      }

      button:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 2px solid var(--accent-light);
        outline-offset: 2px;
      }

      #selectWorkout {
        width: 100%;
      }

      #topStatus:empty {
        display: none;
      }

      #workout {
        flex-direction: column;
        gap: 4px;
        flex: 1;
      }

      #workout:not([hidden]) {
        display: flex;
      }

      #header {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .header-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }

      .header-buttons {
        display: flex;
        gap: 6px;
        flex-shrink: 0;
      }

      #workoutName {
        font-size: 18px;
        font-weight: 700;
        color: var(--text);
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .exercise-count {
        font-size: 12px;
        color: var(--text-dim);
        flex-shrink: 0;
        white-space: nowrap;
      }

      .icon-btn {
        padding: 4px 8px;
        font-size: 14px;
        line-height: 1.4;
        background: var(--surface);
        flex-shrink: 0;
      }

      #editPanel {
        flex-direction: column;
        gap: 6px;
        padding: 8px 0;
      }

      #editPanel:not([hidden]) {
        display: flex;
      }

      #editPanel label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: var(--text-dim);
      }

      #editPanel label input {
        width: 80px;
        text-align: right;
      }

      .meta-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0 4px;
        color: var(--text-dim);
        font-size: 11px;
        white-space: nowrap;
      }

      .meta-row span:not(:empty):not(:last-child)::after {
        content: ' · ';
      }

      #currentExerciseName {
        width: 100%;
        font-size: 16px;
        font-weight: 600;
      }

      .nav-row {
        display: flex;
        gap: 8px;
      }

      .nav-row button {
        flex: 1;
        padding: 8px;
        font-size: 14px;
      }

      .nav-row button:disabled {
        opacity: 0.4;
        cursor: default;
        background: var(--surface);
      }

      .prev-block {
        color: var(--text-dim);
        font-size: 12px;
        line-height: 1.4;
        border-left: 3px solid var(--border);
        padding-left: 8px;
      }

      .prev-block b {
        color: var(--text);
      }

      .prev-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0 8px;
      }

      .prev-row span:not(:empty):not(:last-child)::after {
        content: ' · ';
      }

      .circuit-panel {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .circuit-row {
        display: grid;
        grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr);
        gap: 6px;
        align-items: center;
      }

      .circuit-row .circuit-name {
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
      }

      .circuit-row input {
        width: 100%;
        min-width: 0;
      }

      .circuit-legend {
        font-size: 10px;
        color: var(--text-dim);
      }

      .circuit-water-banner {
        display: none;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        background: var(--surface);
        border: 1px solid #2e6bd6;
        border-radius: 6px;
        color: var(--text);
        font-size: 14px;
      }

      .circuit-water-banner.visible {
        display: flex;
      }

      .circuit-water-banner .dismiss {
        background: var(--surface);
        border-color: var(--border);
        padding: 4px 10px;
        font-size: 13px;
      }

      .quick-legend {
        font-size: 10px;
        color: var(--text-dim);
        margin-top: 2px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      td {
        padding: 2px 4px;
        vertical-align: middle;
      }

      td input {
        width: 100%;
      }

      .quick-row {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
        margin: 2px 0;
      }

      .quick-row button {
        width: 3.2em;
        padding: 4px 0;
        text-align: center;
        font-size: 12px;
        font-weight: 400;
        background: var(--surface);
      }

      .quick-row button.quick-current {
        border-color: var(--accent-light);
        border-width: 2px;
        border-style: solid;
        font-weight: 700;
      }

      .quick-row button.quick-current::after {
        content: ' \25CF'; /* ● solid circle: "previous value" */
        font-size: 0.65em;
        vertical-align: middle;
      }

      .quick-row button.quick-recent {
        border-color: #4a90d9;
        border-width: 2px;
        border-style: dashed;
        font-weight: 700;
      }

      .quick-row button.quick-recent::after {
        content: ' \25B2'; /* ▲ triangle: "just did" */
        font-size: 0.65em;
        vertical-align: middle;
      }

      .quick-row button.quick-current.quick-recent {
        border-style: double;
        border-width: 4px;
      }

      .quick-row button.quick-current.quick-recent::after {
        content: ' \25CF\25B2';
      }

      .save-time-cell {
        text-align: right;
      }

      .action-row {
        display: flex;
        gap: 8px;
        margin-top: 4px;
      }

      .action-row button {
        flex: 1;
        padding: 10px;
        font-size: 14px;
      }

      #timer {
        font-size: 18px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        margin-left: 6px;
      }

      #status,
      #topStatus {
        margin-top: 2px;
        font-size: 12px;
        color: var(--text-dim);
      }

      #topStatus {
        margin-bottom: 8px;
        font-size: 14px;
      }

      h1,
      h2 {
        margin: 0;
        font-size: inherit;
      }

      #pageHeading {
        font-size: 20px;
        font-weight: 700;
        margin-bottom: 8px;
      }

      #picker label,
      .field-label {
        display: block;
        font-size: 12px;
        color: var(--text-dim);
        margin-bottom: 4px;
      }

      .circuit-head {
        display: grid;
        grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr);
        gap: 6px;
        font-size: 11px;
        color: var(--text-dim);
      }

      .icon-btn .btn-label {
        margin-left: 2px;
        font-size: 12px;
      }

      #saveDetails {
        margin-top: 8px;
        font-size: 12px;
        color: var(--text-dim);
      }

      #savePayload {
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 30vh;
        overflow: auto;
        background: var(--surface);
        padding: 8px;
        border-radius: 6px;
        color: var(--text);
      }
    </style>
  </head>

    <section id="picker" aria-label="Choose a routine">
      <h1 id="pageHeading">Workout Tracker</h1>
      <label id="routineLabel" for="selectWorkout">Routine</label>
      <select id="selectWorkout" data-testid="routine-picker" onchange="selectWorkout()">
        <option value="" disabled selected>Choose a workout</option>
      </select>
    </section>
    <div id="topStatus" role="status" aria-live="polite"></div>

    <main id="workout" hidden>
      <div id="header">
        <div class="header-top">
          <h1 id="workoutName"></h1>
          <h2 id="exerciseCount" class="exercise-count"></h2>
          <div class="header-buttons">
            <button
              id="homeBtn"
              class="icon-btn"
              type="button"
              data-testid="home"
              onclick="goHome()"
              aria-label="Home"
            >
              🏠 <span class="btn-label">Home</span>
            </button>
            <button
              id="editToggle"
              class="icon-btn"
              type="button"
              data-testid="settings"
              onclick="toggleEditMode()"
              aria-label="Settings"
            >
              ⚙ <span class="btn-label">Settings</span>
            </button>
          </div>
        </div>
        <div class="meta-row">
          <span id="workoutLastCompleted"></span>
          <span id="workoutLastDuration"></span>
          <span id="workoutCurrentDuration"></span>
        </div>
      </div>

      <section id="editPanel" aria-label="Settings" hidden>
        <h2>Settings</h2>
        <label
          >Weight quick-button increment
          <input
            type="number"
            id="cfgWeightInc"
            data-testid="weight-inc"
            inputmode="decimal"
            step="any"
          />
        </label>
        <label
          >Reps quick-button increment
          <input
            type="number"
            id="cfgRepsInc"
            data-testid="reps-inc"
            inputmode="decimal"
            step="any"
          />
        </label>
        <label
          >Default rest timer (seconds)
          <input
            type="number"
            id="cfgTimerDefault"
            data-testid="timer-default"
            inputmode="numeric"
            step="1"
          />
        </label>
        <div class="action-row">
          <button
            id="applySettingsBtn"
            data-testid="apply-settings"
            type="button"
            onclick="applyEditPanel()"
          >
            Apply
          </button>
          <button
            id="closeSettingsBtn"
            data-testid="close-settings"
            type="button"
            onclick="toggleEditMode()"
          >
            Done
          </button>
        </div>
      </section>

      <div id="mainContent">
        <section id="linearView" aria-label="Exercise">
          <label class="field-label" for="currentExerciseName">Exercise</label>
          <input
            type="text"
            id="currentExerciseName"
            name="currentExerciseName"
            data-testid="exercise-name"
          />

          <div class="nav-row">
            <button
              id="prevExerciseBtn"
              data-testid="prev-exercise"
              type="button"
              onclick="prevExercise()"
            >
              ◀ Prev
            </button>
            <button
              id="nextExerciseBtn"
              data-testid="next-exercise"
              type="button"
              onclick="nextExercise()"
            >
              Next ▶
            </button>
          </div>

          <div class="prev-block">
            <b>Previous:</b>
            <div class="prev-row">
              <span id="previousWorkoutExerciseReps"></span>
              <span id="previousWorkoutExerciseWeights"></span>
              <span id="previousWorkoutExerciseTimes"></span>
            </div>
            <div class="quick-legend">
              ● = same as prev workout &nbsp; ▲ = what you just entered
            </div>
          </div>

          <b>Current:</b>
          <table>
            <tbody>
              <tr>
                <td><label for="reps">Reps:</label></td>
                <td>
                  <input type="text" id="reps" name="reps" data-testid="reps" inputmode="decimal" />
                </td>
              </tr>
              <tr>
                <td></td>
                <td colspan="2">
                  <div id="repsQuick" class="quick-row" data-testid="quick-reps"></div>
                </td>
              </tr>
              <tr>
                <td><label for="weights">Weight:</label></td>
                <td>
                  <input
                    type="text"
                    id="weights"
                    name="weights"
                    data-testid="weights"
                    inputmode="decimal"
                  />
                </td>
              </tr>
              <tr>
                <td></td>
                <td colspan="2">
                  <div id="weightsQuick" class="quick-row" data-testid="quick-weights"></div>
                </td>
              </tr>
              <tr>
                <td><label for="times">Time:</label></td>
                <td><input type="text" id="times" name="times" data-testid="times" /></td>
                <td class="save-time-cell">
                  <button
                    id="saveTimeBtn"
                    data-testid="save-time"
                    type="button"
                    onclick="saveTime()"
                  >
                    Save Time
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </section>

        <section id="circuitView" aria-label="Circuit" hidden>
          <div id="circuitRounds" class="circuit-panel" data-testid="circuit-rounds"></div>
          <div class="circuit-legend">
            Round timer starts when you finish the round. Comma-separated values are per round.
          </div>
          <div
            id="circuitWaterBanner"
            class="circuit-water-banner"
            role="status"
            aria-live="polite"
          >
            <span>Water break — grab a drink before the next round.</span>
            <button
              id="dismissWaterBtn"
              data-testid="dismiss-water"
              type="button"
              class="dismiss"
              onclick="dismissWaterBanner()"
            >
              Done
            </button>
          </div>
          <div class="nav-row">
            <button
              id="circuitPrevBtn"
              data-testid="prev-round"
              type="button"
              onclick="circuitPrevRound()"
            >
              ◀ Prev Round
            </button>
            <button
              id="circuitNextBtn"
              data-testid="next-round"
              type="button"
              onclick="circuitNextRound()"
            >
              Next Round ▶
            </button>
          </div>
        </section>

        <div class="action-row">
          <button
            id="saveWorkoutBtn"
            data-testid="save-workout"
            type="button"
            onclick="saveWorkout()"
          >
            Save Workout
          </button>
          <button id="timerBtn" data-testid="timer" type="button" onclick="resetTimer()">
            Timer <span id="timer" data-testid="timer-display"></span>
          </button>
        </div>

        <div id="status" role="status" aria-live="polite"></div>
      </div>
    </main>
    <details id="saveDetails" data-testid="save-details" hidden>
      <summary>Workout entry to paste</summary>
      <pre id="savePayload" data-testid="save-payload"></pre>
    </details>

    <script src="src/app.js"></script>
  </body>
</html>
